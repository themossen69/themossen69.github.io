name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - futbol
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate futbol/config.js
        env:
          CSV_URL: ${{ secrets.CSV_URL }}
        run: |
          if [ -z "$CSV_URL" ]; then
            echo "The CSV_URL repository secret is not configured."
            exit 1
          fi
          node -e "const fs=require('fs'); fs.writeFileSync('futbol/config.js', 'window.CSV_URL = ' + JSON.stringify(process.env.CSV_URL) + ';\n');"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
